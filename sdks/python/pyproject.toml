[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stateguard"
version = "0.1.0"
description = "Enterprise Agent State Security Gateway & Trace Auditing Client SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
all = [
    "anthropic>=0.20.0",
    "openai>=1.12.0",
    "google-generativeai>=0.4.0",
    "langchain-core>=0.1.0",
]
