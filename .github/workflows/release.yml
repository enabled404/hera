name: Release Packaging & Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binaries
        shell: bash
        run: |
          BUILD_CMD="cargo"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            BUILD_CMD="cross"
          fi

          $BUILD_CMD build --release --target ${{ matrix.target }} -p stateguard-proxy -p stateguard-cli

      - name: Package Artifacts
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="stateguard-${TAG_NAME}-${{ matrix.target }}"
          STAGING_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${STAGING_DIR}"

          BIN_DIR="target/${{ matrix.target }}/release"
          cp "${BIN_DIR}/stateguard-proxy" "${STAGING_DIR}/"
          cp "${BIN_DIR}/stateguard-cli" "${STAGING_DIR}/"

          # Strip binaries if available
          if [[ "${{ matrix.os }}" == *"ubuntu"* ]]; then
            if [ "${{ matrix.use_cross }}" = "false" ]; then
              strip "${STAGING_DIR}/stateguard-proxy" "${STAGING_DIR}/stateguard-cli" || true
            fi
          elif [[ "${{ matrix.os }}" == *"macos"* ]]; then
            strip "${STAGING_DIR}/stateguard-proxy" "${STAGING_DIR}/stateguard-cli" || true
          fi

          cp README.md LICENSE "${STAGING_DIR}/" 2>/dev/null || true

          tar -czvf "${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            stateguard-*.tar.gz
            stateguard-*.tar.gz.sha256

  publish-github-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifact Directory
        run: |
          mkdir -p release_assets
          find artifacts -type f -name "stateguard-*" -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
