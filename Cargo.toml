[workspace]
resolver = "2"
members = [
    "crates/stateguard-crypto",
    "crates/stateguard-scanner",
    "crates/stateguard-vault",
    "crates/stateguard-proxy",
    "crates/stateguard-cli",
    "tests/redteam_simulations",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["StateGuard Contributors <security@stateguard.internal>"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
